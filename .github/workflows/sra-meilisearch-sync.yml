# Weekly (or manual) full upsert of SRA organisations into MySQL (optional) + Meilisearch.
# Daily sync + purge runs in sra-daily-sync.yml — use this workflow for manual reruns only.

name: Sync SRA organisations to Meilisearch (manual)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Prisma migrate (MySQL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set — skipping migrate (Meilisearch-only sync)."
          else
            npx prisma migrate deploy
          fi
      - name: Fetch SRA GetAll, upsert MySQL + Meilisearch
        env:
          SRA_APIM_SUBSCRIPTION_KEY: ${{ secrets.SRA_APIM_SUBSCRIPTION_KEY }}
          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          SRA_INDEX_SKIP_GEO: "1"
        run: npm run sra:sync -- --skip-embeddings
