# Daily SRA Data Share sync → Postgres purge + Typesense re-index.
# Matches the SRA register 24h refresh cycle.

name: Daily SRA sync and index

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECTORY_SEARCH_BACKEND: postgres
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Prisma migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
      - name: SRA GetAll sync (Postgres + purge)
        env:
          SRA_APIM_SUBSCRIPTION_KEY: ${{ secrets.SRA_APIM_SUBSCRIPTION_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
          SRA_INDEX_SKIP_GEO: "1"
        run: npm run sra:sync -- --skip-embeddings --skip-typesense
      - name: Check Typesense reachability
        id: typesense
        env:
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
        run: |
          if [ -z "$TYPESENSE_HOST" ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TYPESENSE_HOST secret is not set — skipping Typesense re-index. Production search uses Postgres."
            exit 0
          fi
          if getent hosts "$TYPESENSE_HOST" >/dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TYPESENSE_HOST does not resolve ($TYPESENSE_HOST). Skipping Typesense re-index — restore cluster per web/docs/ops/restore-typesense.md"
          fi
      - name: Typesense SRA re-index (throttled)
        if: steps.typesense.outputs.reachable == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          TYPESENSE_PROTOCOL: ${{ secrets.TYPESENSE_PROTOCOL }}
          TYPESENSE_PORT: ${{ secrets.TYPESENSE_PORT }}
          TYPESENSE_IMPORT_BATCH_SIZE: "5"
          TYPESENSE_IMPORT_PAUSE_MS: "3000"
          SEARCH_INDEX_SRA_PAGE_SIZE: "100"
          SRA_INDEX_SKIP_GEO: "1"
        run: npm run search:index:sra
      - name: Typesense skipped notice
        if: steps.typesense.outputs.reachable != 'true'
        run: echo "SRA Postgres sync completed. Typesense re-index skipped (host unreachable or unset)."
