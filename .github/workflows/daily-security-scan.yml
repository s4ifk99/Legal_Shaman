name: Daily security scan

# GitHub cron is UTC and does not follow Europe/London.
# 02:00 London is 01:00 UTC during BST and 02:00 UTC during GMT.
# Both hours are scheduled. london-schedule-gate.mjs runs only the matching slot.
# Scheduled workflows run from the default branch only. GitHub may delay or skip crons.

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-security-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPORT_DIR: ${{ runner.temp }}/security-scan
      SCANNER_BIN: ${{ runner.temp }}/scanners
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Checkout default branch snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: London 02:00 gate
        id: gate
        run: node .github/security/scripts/london-schedule-gate.mjs

      - name: Record schedule skip
        if: steps.gate.outputs.run != 'true'
        run: |
          {
            echo "# Security scan: not run"
            echo ""
            echo "${{ steps.gate.outputs.reason }}"
            echo ""
            echo "No scanners ran. This is not a clean result."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Self test
        id: selftest
        if: steps.gate.outputs.run == 'true'
        run: node .github/security/scripts/self-test.mjs

      - name: Resolve deployed URL
        id: target
        if: steps.selftest.outcome == 'success'
        continue-on-error: true
        run: node .github/security/scripts/resolve-scan-target.mjs

      - name: Install pinned scanners
        if: steps.selftest.outcome == 'success'
        run: bash .github/security/scripts/install-pinned-scanners.sh "$SCANNER_BIN"

      - name: Dependency scan (npm audit)
        if: steps.selftest.outcome == 'success'
        run: bash .github/security/scripts/run-npm-audit.sh

      - name: Dependency scan (OSV)
        if: steps.selftest.outcome == 'success'
        run: bash .github/security/scripts/run-osv.sh

      - name: Secret scan
        if: steps.selftest.outcome == 'success'
        run: bash .github/security/scripts/run-gitleaks.sh

      - name: Static analysis
        if: steps.selftest.outcome == 'success'
        run: bash .github/security/scripts/run-semgrep.sh

      - name: Application security checks
        if: steps.selftest.outcome == 'success'
        run: node .github/security/scripts/application-checks.mjs

      - name: OWASP ZAP baseline
        if: steps.selftest.outcome == 'success' && steps.target.outcome == 'success'
        run: bash .github/security/scripts/run-zap.sh

      - name: Assemble report
        id: assemble
        if: steps.selftest.outcome == 'success'
        run: node .github/security/scripts/assemble-report.mjs

      - name: Encrypt report
        id: encrypt
        if: steps.assemble.outcome == 'success'
        env:
          SECURITY_SCAN_REPORT_KEY: ${{ secrets.SECURITY_SCAN_REPORT_KEY }}
        run: bash .github/security/scripts/encrypt-report.sh

      - name: Upload encrypted report
        id: upload
        if: steps.encrypt.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report-${{ steps.assemble.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-scan/publish
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Publish summary and fail on high findings or an incomplete scan
        if: always() && steps.gate.outputs.run == 'true'
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: node .github/security/scripts/enforce-conclusion.mjs
