# Daily security scan at 02:00 Europe/London.
# GitHub cron is UTC and does not follow UK daylight saving time.
# 02:00 London is 01:00 UTC during BST and 02:00 UTC during GMT.
# Both hours are scheduled. The gate continues only when the London hour is 02.
# workflow_dispatch ignores the clock and still scans the default branch.
# A delayed run that starts outside that London hour is skipped, so a day can be missed.
# Re-run this workflow manually if that happens. GitHub may also disable schedules
# on a public repository after 60 days without repository activity.

name: Daily security scan

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-security-scan
  cancel-in-progress: false

jobs:
  gate:
    name: London 02:00 gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      london: ${{ steps.gate.outputs.london }}
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 as of 2026-10-28
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 as of 2026-10-28
        with:
          node-version: "22"
      - name: Decide whether this run is 02:00 in London
        id: gate
        run: node .github/security/scripts/london-schedule-gate.mjs

  scan:
    name: Security scan
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 as of 2026-10-28
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 as of 2026-10-28
        with:
          node-version: "22"
      - name: Run scanners and encrypt the report
        id: scan
        env:
          SCAN_REF: ${{ github.event.repository.default_branch }}
          SECURITY_SCAN_REPORT_KEY: ${{ secrets.SECURITY_SCAN_REPORT_KEY }}
        run: bash .github/security/scripts/run-security-scan.sh
        continue-on-error: true
      - name: Upload encrypted report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 as of 2026-10-28
        with:
          name: ${{ steps.scan.outputs.artifact_name || format('security-scan-{0}', github.run_id) }}
          path: .security-scan-out/upload/*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Fail unless the scan completed without high or critical findings
        if: always() && steps.scan.outcome != 'success'
        run: |
          echo "This workflow failed. The job summary states whether that is because of high or critical findings, a scanner that did not finish, or a report that could not be encrypted. A failed workflow is not a clean result."
          exit 1
